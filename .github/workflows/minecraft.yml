name: Minecraft Crossplay Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Paper
        run: |
          VERSION="$(curl -fsSL https://api.papermc.io/v2/projects/paper | jq -r '.versions[-1]')"
          BUILD="$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/$VERSION" | jq -r '.builds[-1]')"
          curl -fL "https://api.papermc.io/v2/projects/paper/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar" -o server.jar

      - name: Install Geyser + Floodgate
        run: |
          mkdir -p plugins
          curl -fL "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" -o plugins/Geyser-Spigot.jar
          curl -fL "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" -o plugins/floodgate-spigot.jar

      - name: Start server
        env:
          PLAYIT_AUTH: ${{ secrets.PLAYIT_AUTH }}
        run: |
          if [ -n "$PLAYIT_AUTH" ]; then
            curl -fsSL https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -o playit
            chmod +x playit
            nohup ./playit --secret "$PLAYIT_AUTH" > playit.log 2>&1 &
            sleep 8
          fi
          java -Xms1G -Xmx4G -XX:+UseG1GC -jar server.jar --nogui
